<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾忆 · 你的私人记忆空间</title><meta name="description" content="随手记录文字、图片、链接与声音，留待需要时找回。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232b3955'/%3E%3Cpath d='M12 12h16v16H12z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head><body>
<aside class="rail"><button class="logo" id="home" aria-label="回到首页">▣</button><nav><button data-view="library" aria-label="全部记忆">▤<span>记忆</span></button><button data-view="topics" aria-label="主题集合">▦<span>主题</span></button><button data-view="tasks" aria-label="行动提醒">◷<span>行动</span></button><button data-view="trash" aria-label="回收站">⌫<span>回收站</span></button></nav><button id="account" class="account" aria-label="账号与 AI 设置">我</button></aside>
<main><header><a href="/" class="wordmark">拾忆 <span>SHIYI</span></a><span class="headernote" id="connection">连接你的空间…</span></header><section class="quiet"><div class="greeting"><p class="eyebrow">A LITTLE SPACE FOR YOUR MIND</p><h1>先放在这里。<br><span>需要时，再想起来。</span></h1><p>一个念头，一段对话，或一句不想忘记的话。</p></div><div class="composer"><div class="modebar" role="group" aria-label="收集方式"><button class="active" data-mode="text">文字 / 链接</button><button data-mode="image">图片</button><button data-mode="audio">声音</button></div><textarea id="thought" aria-label="要保存的内容" placeholder="随手写点什么，也可以粘贴链接…" maxlength="20000"></textarea><div id="attachmentArea" hidden><label class="filepick" id="filepick"><span id="filelabel">选择图片，或拖到这里</span><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><div id="attachmentPreview"></div></div><div id="recordArea" hidden><button id="record" class="record">● 开始录音</button><span id="recordState">最长 2 分钟，可先试听再保存</span></div><div class="composerfoot"><span id="savehint">链接会被保存，只有点击时才打开。</span><button id="save" class="primary">收好 ↗</button></div></div><p class="privacy">资料保存在你的私有账号空间 · AI 仅在你点击处理时使用</p><div class="searchline"><span>⌕</span><input id="search" aria-label="找回记忆" placeholder="记得哪个词？找一找…"><kbd>⌘ K</kbd></div><div id="homeResults" hidden></div><div class="recentline"><button data-view="library">打开记忆库 <span id="total">0</span> ↗</button><button id="trydemo">看看整理后的样子</button></div><div id="banner" role="status"></div></section><footer><span>留住内容，也留住当时的想法。</span><button id="aboutai">AI 能帮我做什么？</button></footer></main>
<dialog id="panel" class="panel"><div class="paneltop"><div><p class="eyebrow">YOUR MEMORY SPACE</p><h2 id="paneltitle">全部记忆</h2></div><button data-close="panel" aria-label="关闭侧栏">×</button></div><div id="panelbody"></div></dialog><dialog id="detail"><div class="modalhead"><h2>这段记忆</h2><button data-close="detail" aria-label="关闭详情">×</button></div><div id="detailbody"></div></dialog><dialog id="confirm"><div class="modalhead"><h2>移到回收站？</h2><button data-close="confirm" aria-label="取消删除">×</button></div><p>它将不再出现在搜索和行动中。你可以在回收站恢复；原始文件仍保留。</p><div class="actions"><button data-close="confirm">保留</button><button id="confirmDelete" class="danger">移到回收站</button></div></dialog><dialog id="accountDialog"><div class="modalhead"><h2>账号与 AI</h2><button data-close="accountDialog" aria-label="关闭账号设置">×</button></div><div id="accountbody"></div></dialog><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
