<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾忆 · 记忆管家</title><meta name="description" content="记忆管家 Web 交互原型"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%233f56db'/%3E%3Cpath d='M12 12h16v16H12z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#">▣ <b>拾忆</b><small>记忆管家</small></a><p class="navlabel">我的空间</p><nav id="nav"></nav><div class="sidebottom"><strong>随手存下，慢慢用上。</strong><p>你的每一点好奇，都有去处。</p><span>交互原型 · 演示数据</span></div></aside><main><header><span>个人空间 <span class="muted"> / </span> <span id="crumb">收件箱</span></span><span class="avatar">我</span></header><section class="workspace"><div class="titlebar"><div><p class="eyebrow">YOUR EVERYDAY MEMORY</p><h1 id="heading">每一份收藏，都有回响。</h1><p id="subtitle" class="muted">从一个关键词，找回当时想留住的东西。</p></div><button class="primary" id="import">＋ 导入截图</button></div><div class="searchbox"><span>⌕</span><input id="search" aria-label="搜索记忆" placeholder="记得哪个词？试试「歌名」「自他动词」「耳机」"><kbd>⌘ K</kbd></div><div class="chips" id="suggestions"><span>试着找找</span><button data-query="歌名">弹幕里推荐的歌</button><button data-query="日语">最近存的日语口诀</button><button data-query="商品">想试试的好物</button></div><div class="insight"><div class="spark">✦</div><div><strong>你的收藏，已经有了线索</strong><p>日语学习资料可以放在一起。想不想复习，由你决定。</p></div><button id="viewstudy">看看关联资料 ↗</button></div><div class="sectionrow"><h2 id="listtitle">最近收下的</h2><span id="count" class="muted"></span></div><div id="filters" class="filters"></div><div id="content"></div><footer>原型中搜索使用示例关键词匹配；不会调用 AI 或发送系统通知。</footer></section></main><button class="assistant" id="helper" aria-label="打开记忆助手">✦ <span>记忆助手</span></button><dialog id="detail"><div id="detailbody"></div></dialog><dialog id="upload"><div class="modalhead"><h2>给记忆一个入口</h2><button data-close="upload" aria-label="关闭">×</button></div><p class="muted">可选本机图片预览，仅在当前页面保留，不上传。原型不会自动识别图片。</p><label class="drop" id="drop">＋<strong>拖入截图，或点击选择</strong><span>PNG、JPG、WebP · 每张不超过 10 MB</span><input type="file" id="files" accept="image/png,image/jpeg,image/webp" multiple></label><button class="primary full" id="sample">用日语示例体验完整整理流程</button></dialog><dialog id="assistantDialog"><div class="modalhead"><h2>✦ 记忆助手</h2><button data-close="assistantDialog" aria-label="关闭">×</button></div><p>你想从哪一段记忆开始？</p><div class="helperactions"><button data-query="歌名">找回弹幕里的歌曲</button><button data-query="日语">看看我的日语资料</button><button id="showtasks">查看需要跟进的事</button></div><p class="muted">这是预设交互演示，尚未接入 AI 对话。</p></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
